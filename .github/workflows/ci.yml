name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # Windows and macOS also run the real clipboard round trip, which checks
        # that non-ASCII text survives PowerShell / pbcopy intact.
        include:
          - os: windows-latest
            python-version: "3.14"
            clipboard-tests: "1"
          - os: macos-latest
            python-version: "3.14"
            clipboard-tests: "1"
    env:
      ADAPTIVE_COMM_CLIPBOARD_TESTS: ${{ matrix.clipboard-tests }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      # No API key is configured: the tests use a fake client and make no network calls.
      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report

  lint:
    name: Lint, format, and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check --output-format=github src tests evals
          ruff format --check src tests evals
      - name: Mypy (strict)
        run: mypy
