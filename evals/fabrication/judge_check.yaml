# Known answers for checking the judge before trusting it. Each rewrite was
# written by hand with a known verdict: faithful rewrites must pass, rewrites
# with a planted addition must be caught, and non-answers must fail the
# keeps_meaning check (null means that verdict isn't checked). Run with: python evals/fabrication/run_eval.py --check-judge

