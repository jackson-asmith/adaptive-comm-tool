[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-comm-tool"
version = "0.3.1"
description = "See how a message lands with different people on your team, and how to rephrase it for each of them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "prompt_toolkit>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
# ruff and mypy are pinned so local and CI checks agree.
dev = ["pytest>=8.0", "coverage>=7.0", "ruff==0.16.9", "mypy==2.3.1", "types-PyYAML"]

[project.scripts]
adaptive-comm = "adaptive_comm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_comm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, simplify, pyupgrade, returns,
# complexity, pylint warnings, and ruff's own rules.
select = ["E", "F", "I", "B", "SIM", "UP", "RET", "C90", "PLW", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
files = ["src"]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["src"]
