[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-comm-tool"
version = "0.2.0"
description = "See how a message lands with different people on your team, and how to rephrase it for each of them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.0",
    "prompt_toolkit>=3.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
adaptive-comm = "adaptive_comm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/adaptive_comm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
